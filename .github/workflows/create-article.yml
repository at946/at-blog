name: Create a new article

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-article:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Create branch
        id: branch
        run: |
          BRANCH="article/${{ inputs.slug }}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git switch -c "$BRANCH"

      - name: Create article
        run: pnpm create:article ${{ inputs.slug }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Create article: ${{ inputs.slug }}

      - name: Push branch
        run: git push origin "${{ steps.branch.outputs.branch }}"

      - name: Create pull request
        run: |
          gh pr create \
            --title "Create article: ${{ inputs.slug }}" \
            --head "${{ steps.branch.outputs.branch }}" \
            --base main
        env:
          GH_TOKEN: ${{ github.token }}